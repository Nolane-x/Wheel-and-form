<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>Desktop wheel</title>
  <link rel="stylesheet" href="styles-wheel.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <div class="desk-root" id="deskRoot">
    <div class="desk-file" id="deskFile" hidden>
      <span class="desk-file-icon" id="deskFileIcon"></span>
      <span class="desk-file-text">
        <span class="desk-file-name" id="deskFileName"></span>
        <span class="desk-file-meta" id="deskFileMeta"></span>
      </span>
    </div>

    <div class="wheel-layer is-drag" id="wheelLayer">
      <div class="wheel-shell">
        <div class="wheel-kicker"></div>
        <h2 class="wheel-title"></h2>
        <div class="wheel-sub"></div>
        <div class="wheel-tabs" hidden></div>

        <div class="wheel-stage">
          <div class="wheel-halo"></div>
          <svg class="wheel-svg" viewBox="-140 -140 280 280" width="340" height="340" aria-hidden="true">
            <defs>
              <radialGradient id="petalFill" cx="34%" cy="18%" r="90%">
                <stop offset="0%" stop-color="#f7f6f1" stop-opacity=".98"/>
                <stop offset="58%" stop-color="#e6e9dc" stop-opacity=".88"/>
                <stop offset="100%" stop-color="#c8cec1" stop-opacity=".76"/>
              </radialGradient>
              <radialGradient id="petalActive" cx="38%" cy="20%" r="94%">
                <stop offset="0%" stop-color="#edffb0"/>
                <stop offset="52%" stop-color="#c9f45a"/>
                <stop offset="100%" stop-color="#9bca2d"/>
              </radialGradient>
              <radialGradient id="wheelBackdrop" cx="50%" cy="42%" r="62%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity=".56"/>
                <stop offset="76%" stop-color="#ffffff" stop-opacity=".20"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity=".08"/>
              </radialGradient>
              <filter id="petalShadow" x="-40%" y="-40%" width="180%" height="180%">
                <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity=".18"/>
              </filter>
              <filter id="backdropBlur" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="9"/>
              </filter>
            </defs>
            <circle class="wheel-backdrop" r="127.4" fill="url(#wheelBackdrop)" filter="url(#backdropBlur)"/>
            <circle class="wheel-rim" r="127.4" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="1"/>
            <g class="wheel-petals"></g>
            <circle class="wheel-hub-ring" r="48.5" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="1"/>
          </svg>
          <div class="wheel-center"></div>
        </div>

        <div class="wheel-detail"></div>
        <div class="wheel-keys">
          <span class="wheel-key" data-wheel-key="convert"><kbd>Shift</kbd>Formats</span>
          <span class="wheel-key" data-wheel-key="tools"><kbd>Ctrl</kbd>Tools</span>
          <span class="wheel-key" data-wheel-key="actions"><kbd>Alt</kbd>Actions</span>
        </div>
        <div class="wheel-hint"><kbd>Esc</kbd> cancel</div>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="wheel.js"></script>
  <script src="desktop.js"></script>
</body>
</html>
