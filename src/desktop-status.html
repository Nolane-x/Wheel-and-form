<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>Wheel and Form status</title>
  <link rel="stylesheet" href="desktop-status.css">
</head>
<body>
  <div class="status-card" id="statusCard">
    <div class="status-mark" id="statusMark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8c.7 3.9 1.9 5.3 5.9 6 1.7.3 1.7.9 0 1.2-4 .7-5.2 2.1-5.9 6-.2 1.2-.8 1.2-1 0-.7-3.9-1.9-5.3-5.9-6-1.7-.3-1.7-.9 0-1.2 4-.7 5.2-2.1 5.9-6 .2-1.2.8-1.2 1 0Z" fill="currentColor"/></svg>
    </div>
    <div class="status-body">
      <div class="status-top">
        <div class="status-title" id="statusTitle">Working…</div>
        <button class="status-close" id="statusClose" type="button" aria-label="Close">✕</button>
      </div>
      <div class="status-sub" id="statusSub"></div>
      <div class="status-bar" id="statusBar"><span id="statusProgress"></span></div>
      <div class="status-detail" id="statusDetail"></div>
      <div class="status-error" id="statusError" hidden></div>
      <div class="status-actions" id="statusActions" hidden>
        <button class="status-btn primary" id="statusShow" type="button" hidden>Show</button>
        <button class="status-btn" id="statusSetup" type="button" hidden>Open setup</button>
      </div>
    </div>
  </div>
  <script src="desktop-status.js"></script>
</body>
</html>
